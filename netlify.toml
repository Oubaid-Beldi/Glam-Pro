[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Skip the build (and the production-deploy credits) when a push only touches
  # docs/ or CLAUDE.md. Exit 0 = nothing else changed = skip; exit 1 = build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)CLAUDE.md'"

[functions]
  node_bundler = "esbuild"

[functions."scheduler"]
  schedule = "@hourly"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/auth/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
